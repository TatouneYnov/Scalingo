<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loldle - Devine le Champion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-links">
            <a href="/" style="color: #2d9f2d; text-decoration: none; font-weight: bold;">🎮 Jouer</a>
            <a href="/leaderboard.html" style="color: #e0e0e0; text-decoration: none;">🏆 Classement</a>
            <a href="/profile.html" style="color: #e0e0e0; text-decoration: none;">👤 Profil</a>
        </div>
        <div class="user-menu">
            <span id="navUsername" style="color: #999;"></span>
            <button class="logout-btn" onclick="logout()">Déconnexion</button>
        </div>
    </nav>
        <header>
            <h1>LOLDLAHESS</h1>
            <p class="subtitle">Devine le champion de League of Legends !</p>
            <p class="current-mode" id="currentMode"></p>
        </header>

        <div id="modeSelector">
            <div class="mode-selector-content">
                <h2>Choisis un mode</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" data-mode="unlimited">Illimité</button>
                    <button class="mode-btn" data-mode="daily">Daily</button>
                    <button class="mode-btn" data-mode="hardcore">Hardcore (bientôt)</button>
                </div>
            </div>
        </div>

        <div class="game-info">
            <p>Trouve le champion en utilisant les indices !</p>
        </div>

        <div class="search-container">
            <input 
                type="text" 
                id="championSearch" 
                placeholder="Tape le nom d'un champion..." 
                autocomplete="off"
                disabled
            >
            <div id="suggestions" class="suggestions"></div>
        </div>

        <div id="guesses" class="guesses-container"></div>

        <div id="winMessage" class="win-message hidden">
            <div class="win-content">
                <h2>🎉 Félicitations !</h2>
                <p id="winText"></p>
                <button onclick="startNewGame()" class="play-again-btn">Nouvelle partie</button>
            </div>
        </div>

        <div class="legend">
            <h3>Légende :</h3>
            <div class="legend-items">
                <div class="legend-item">
                    <span class="legend-box correct"></span>
                    <span>Correct</span>
                </div>
                <div class="legend-item">
                    <span class="legend-box partial"></span>
                    <span>Partiellement correct</span>
                </div>
                <div class="legend-item">
                    <span class="legend-box incorrect"></span>
                    <span>Incorrect</span>
                </div>
            </div>
        </div>

        <div id="leaderboard" class="leaderboard hidden">
            <h3>Classement du jour</h3>
            <div id="leaderboardList"></div>
        </div>
    </div>

    <script src="header.js"></script>
    <script src="app.js"></script>
</body>
</html>
