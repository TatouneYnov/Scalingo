<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - LOLDLAHESS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>LOLDLAHESS</h1>
            <p class="subtitle">Connexion</p>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <input type="text" id="loginUsername" placeholder="Pseudo" required autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Mot de passe" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Se connecter</button>
            </form>
            
            <div class="auth-footer">
                <p>Pas encore de compte ? <a href="#" id="showRegister">S'inscrire</a></p>
            </div>
        </div>
        
        <div class="auth-box hidden" id="registerBox">
            <h1>LOLDLAHESS</h1>
            <p class="subtitle">Inscription</p>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <input type="text" id="registerUsername" placeholder="Pseudo (unique)" required autocomplete="username" minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <input type="password" id="registerPassword" placeholder="Mot de passe (min 6 caractères)" required autocomplete="new-password" minlength="6">
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe" required autocomplete="new-password" minlength="6">
                </div>
                <button type="submit" class="btn-primary">S'inscrire</button>
            </form>
            
            <div class="auth-footer">
                <p>Déjà un compte ? <a href="#" id="showLogin">Se connecter</a></p>
            </div>
        </div>
        
        <div id="errorMessage" class="error-message hidden"></div>
    </div>
    
    <script src="auth-client.js"></script>
</body>
</html>
